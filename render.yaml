# Hospedagem do Indaga e da página do estudo no Render (render.com).
# No painel do Render: New > Blueprint > escolha este repositório.
# Os valores marcados com sync: false são pedidos na criação e ficam só no Render.
services:
  - type: web
    name: indaga
    runtime: python
    region: virginia          # mesma região do Supabase (us-east-1)
    plan: free                # dorme após 15 min sem acesso; durante a coleta, prefira "starter"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /estudo
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Os mesmos valores do .env usado na avaliação técnica: se mudarem, o
      # config_hash das execuções do estudo deixa de bater com o da Fase 5.
      - key: INDAGA_MODELO
        value: claude-opus-5-5
      - key: INDAGA_ESFORCO
        value: medium
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_LEITURA
        sync: false
      # Protege a interface livre (/). A página /estudo usa o token do participante.
      - key: INDAGA_SENHA_ACESSO
        sync: false
